name: Theme check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Tringify CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/tringify/cli/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Partials are in sync
        run: python3 scripts/sync_partials.py --check

      - name: Compiled sections match their source
        run: |
          tringify theme build .
          git diff --exit-code -- sections src/.generated-sections.json theme.json

      - name: Theme check (upload rules)
        run: tringify theme check . --mode sealed
